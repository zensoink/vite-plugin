name: Release to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Node 22 ships npm 10, which cannot do OIDC trusted publishing (needs >= 11.5).
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@11

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Tag must match package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      # Tokenless publish via npm Trusted Publishing (OIDC).
      # Requires the repo + this workflow registered as a trusted
      # publisher on the npm package page. No NPM_TOKEN needed.
      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
