name: Release to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Node 22 ships npm 10, which cannot do OIDC trusted publishing (needs >= 11.5).
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@11

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Tag must match package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      # Tokenless publish via npm Trusted Publishing (OIDC).
      # Requires the repo + this workflow registered as a trusted
      # publisher on the npm package page. No NPM_TOKEN needed once set up.
      # Bootstrap: for the very first publish of a new package name (no npm
      # page exists yet, so no trusted publisher can be registered), set a
      # classic `NPM_TOKEN` repo secret and the token step publishes without
      # provenance instead. Remove the secret after OIDC is registered.
      - name: Publish to npm (OIDC)
        if: ${{ secrets.NPM_TOKEN == '' }}
        run: npm publish --provenance --access public

      - name: Publish to npm (token bootstrap)
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
